name = "dwenn"
main = "worker.mjs"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "dwenn.ch"
custom_domain = true

[vars]
CONTACT_TO = "dwenn@live.fr"
CONTACT_FROM = "contact@dwenn.ch"
TURNSTILE_SITE_KEY = "0x4AAAAAAD1xCfhJjR1UGuKA"
TURNSTILE_EXPECTED_HOSTNAMES = "dwenn.ch,www.dwenn.ch"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "dwenn@live.fr"
allowed_sender_addresses = ["contact@dwenn.ch"]

[observability]
enabled = true
head_sampling_rate = 1.0
